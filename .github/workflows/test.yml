name: test

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs of the same branch: on a PR only the newest push is
# worth checking. main is exempt — each commit there is a release gate, and a
# cancelled run leaves that commit with no verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # No lockfile by design (consumption realism): every run resolves the
      # latest semver-compatible published packages. That IS the dogfooding —
      # a break here means a published package broke its consumers. It is also
      # why there is no dependency cache here: nothing stable to key one on,
      # and a cache would defeat the point of resolving fresh.
      - name: Install from the registry
        run: npm install

      # One command, because the gates are one set. run-gates owns the start
      # order, the ports, and which exhibit each gate needs — the same script a
      # person runs locally, so CI and the README cannot drift apart. It fails
      # loudly if a host never answers, rather than letting a dead host surface
      # as whichever error the gate happens to produce.
      #
      # Deterministic throughout: scripted providers, no API key, no network model.
      - name: Gates
        run: node host/tools/run-gates.ts
