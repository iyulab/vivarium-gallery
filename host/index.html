<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>vivarium gallery</title>
  <link rel="icon" href="data:," />
  <script type="importmap">
{ "imports": { "@vivariumjs/runtime": "/node_modules/@vivariumjs/runtime/dist/index.js" } }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f6f7f9;
      color: #1c1f24;
    }
    h1 { font-size: 1.1rem; margin: 0 0 0.75rem; }
    h2 { font-size: 0.85rem; margin: 0 0 0.5rem; color: #444; text-transform: uppercase; letter-spacing: 0.03em; }
    .layout { display: flex; gap: 1rem; align-items: flex-start; }
    #canvas-pane {
      flex: 1 1 auto;
      background: #fff;
      border: 1px solid #d8dbe0;
      border-radius: 8px;
      padding: 0.75rem;
      min-width: 0;
    }
    /* FRICTION-20260717-canvas-fixed-height-overflow fix: viewport-relative
       height, sandbox iframe fills it — the sandbox's own scrollbar is the
       single scroll surface. FRICTION-20260718-canvas-height-vs-long-dashboard:
       user-resizable (native drag handle) for reviewing long content. */
    #canvas { height: min(70vh, 640px); border: 1px dashed #c3c7cf; border-radius: 6px; resize: vertical; overflow: hidden; }
    #canvas iframe, #preview iframe { display: block; width: 100%; height: 100%; border: 0; }
    /* 앱이 시드에 무엇을 했는지 화면이 말한다 — 조용히 지우지 않는 것이 요점이므로
       조용히 보존하는 것도 아니다. 둘 다 문장으로 나온다. */
    #seed-state {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.8rem; color: #4b5563; margin-bottom: 0.4rem; min-height: 1.6rem;
    }
    #seed-state.preserved { color: #92400e; }
    #reseed-btn { font-size: 0.75rem; padding: 0.15rem 0.5rem; }
    /* 화면이 여럿인 전시물: 한 컨테이너 안에 나란히 둔다. 한 변경이 여러 화면을
       함께 바꾸는 것을 보이려면 함께 보여야 한다 — 전환은 그 절반을 가린다. */
    #canvas, #preview { display: flex; gap: 0.5rem; }
    .screen { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
    .screen-frame { flex: 1 1 auto; min-height: 0; }
    /* 라벨은 화면이 여럿일 때만 자리를 차지한다 — 하나뿐이면 말할 것이 없다. */
    .screen-label { display: none; }
    .multi .screen-label {
      display: block; font: 11px/1.6 ui-monospace, monospace; color: #6b7280;
      padding: 0 0.25rem; border-bottom: 1px solid #e5e7eb;
    }
    .multi .screen + .screen { border-left: 1px dashed #d5d8de; padding-left: 0.5rem; }
    #panel {
      flex: 0 0 360px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    #panel section {
      background: #fff;
      border: 1px solid #d8dbe0;
      border-radius: 8px;
      padding: 0.75rem;
    }
    #chat-input {
      width: 100%;
      min-height: 60px;
      resize: vertical;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.4rem;
      border: 1px solid #c3c7cf;
      border-radius: 6px;
    }
    #selection-info { font-size: 0.8rem; color: #666; margin: 0.4rem 0; }
    button {
      cursor: pointer;
      border: 1px solid #c3c7cf;
      background: #fff;
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
      margin-right: 0.4rem;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #send-btn, #approve-btn { background: #1c6fdb; color: #fff; border-color: #1c6fdb; }
    #approve-btn:disabled, #send-btn:disabled { background: #a9c3e6; border-color: #a9c3e6; }
    #reject-btn { background: #d64545; color: #fff; border-color: #d64545; }
    #reject-btn:disabled { background: #e6a9a9; border-color: #e6a9a9; }
    #preview { height: 260px; border: 1px dashed #c3c7cf; border-radius: 6px; margin-bottom: 0.5rem; }
    #preview-section[hidden] { display: none; }
    /* 승인 전 검토 표면 (T3) — changeset 이 이미 담은 것을 렌더할 뿐이다. */
    #review { font-size: 0.78rem; }
    .review-head { border-bottom: 1px solid #e5e5e5; padding-bottom: 0.4rem; margin-bottom: 0.5rem; }
    .review-intent { margin: 0 0 0.2rem; font-weight: 600; }
    .review-fp { margin: 0; color: #777; font-family: ui-monospace, Consolas, monospace; font-size: 0.72rem; }
    .review-facets { margin: 0.2rem 0 0; color: #444; }
    .review-facet h3 { font-size: 0.75rem; margin: 0.5rem 0 0.25rem; color: #333; letter-spacing: 0.02em; }
    .review-item { border-left: 2px solid #dde1e8; padding-left: 0.5rem; margin-bottom: 0.4rem; }
    .review-item code { font-family: ui-monospace, Consolas, monospace; font-size: 0.74rem; }
    .review-why { margin: 0.15rem 0; color: #555; }
    .review-ops { margin: 0.15rem 0 0; padding-left: 1rem; font-family: ui-monospace, Consolas, monospace; font-size: 0.72rem; }
    .review-diff { white-space: pre-wrap; font-size: 0.72rem; background: #fafbfc; border: 1px solid #e5e7eb; border-radius: 6px; padding: 0.35rem; margin: 0.25rem 0 0; max-height: 220px; overflow-y: auto; }
    .diff-add { color: #1a7f37; }
    .diff-del { color: #b3261e; }
    .diff-hunk { color: #6639ba; }
    #ledger-list { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; font-size: 0.78rem; font-family: ui-monospace, Consolas, monospace; }
    #ledger-list li { padding: 0.2rem 0; border-bottom: 1px solid #eee; }
    #status { font-size: 0.8rem; color: #444; }
    #status.error { color: #d64545; font-weight: 600; }
    /* 거부는 오류가 아니다 — 제품이 일하고 있다는 신호이고 다음 행동이 다르다
       (문서를 고친다 vs 신고한다). 같은 빨강으로 두면 그 구별이 화면에서 사라진다. */
    #status.refused { color: #92400e; font-weight: 600; }
    #refusal-detail h3 { font-size: 0.78rem; margin: 0.5rem 0 0.2rem; color: #a33; text-transform: none; letter-spacing: 0; }
    #refusal-detail pre { white-space: pre-wrap; font-size: 0.75rem; background: #fdf3f3; border: 1px solid #eed3d3; border-radius: 6px; padding: 0.4rem; margin: 0; max-height: 220px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1 id="exhibit-title">vivarium gallery — 로드 중…</h1>
  <div class="layout">
    <section id="canvas-pane">
      <h2>본 캔버스</h2>
      <div id="seed-state">
        <span id="seed-state-text"></span>
        <button id="reseed-btn" hidden>시드로 되돌리기</button>
      </div>
      <div id="canvas"></div>
    </section>
    <aside id="panel">
      <section id="chat-section">
        <h2>채팅</h2>
        <div id="selection-info">선택 없음</div>
        <button id="clear-selection-btn" hidden>선택 해제</button>
        <textarea id="chat-input" placeholder="예: 카드 하나 추가해줘"></textarea>
        <div style="margin-top: 0.5rem;">
          <button id="send-btn">전송</button>
        </div>
        <div id="refusal-detail" hidden></div>
      </section>
      <section id="preview-section" hidden>
        <h2>제안 프리뷰</h2>
        <div id="preview"></div>
        <h2>무엇이 바뀌는가</h2>
        <div id="review"></div>
        <button id="approve-btn">승인</button>
        <button id="reject-btn">거부</button>
      </section>
      <section id="rollback-section">
        <h2>롤백</h2>
        <button id="rollback-btn" disabled>직전 적용 롤백</button>
      </section>
      <section id="ledger-section">
        <h2>이력 (ledger)</h2>
        <ul id="ledger-list"></ul>
      </section>
      <section id="status-section">
        <h2>상태</h2>
        <div id="status">초기화 대기 중…</div>
      </section>
    </aside>
  </div>
  <script type="module" src="./app.ts"></script>
</body>
</html>
